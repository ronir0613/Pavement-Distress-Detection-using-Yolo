services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pdd-backend
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - CORS_ORIGINS=http://localhost:3000
    volumes:
      # Persist uploads & predictions across restarts during local dev
      - ./backend/uploads:/app/uploads
      - ./backend/predictions:/app/predictions
      - ./backend/history.json:/app/history.json
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=http://localhost:8000
    container_name: pdd-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
